{% extends 'myblog/layout.html' %}

{% block content %}
    <h1>Welcome to My Blog</h1>
    <p>This is the home page of my blog.</p>
     

       <div class="card mb-3">
                <div class="card-body">
                    {% for post in posts %}
                    <a href="{% url 'blog_detail' post.id %}">
                        <h2>{{ post.title }}</h2>
                    </a>
                    <p>{{ post.content }}</p>
                    <small>{{ post.created_at }}</small>
                    <small>by {{ post.user.username }}</small>
                    {% endfor %}
                    
                </div>

{% endblock %}
