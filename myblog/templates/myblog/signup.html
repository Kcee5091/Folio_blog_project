{% extends 'myblog/layout.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
</div>

<p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
